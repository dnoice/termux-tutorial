<?xml version="1.0" encoding="UTF-8"?>
<!--
✒ Metadata
    - Title: Linux Scatter Field (digiSpace Edition - v1.0)
    - File Name: linux_scatter_field.svg
    - Relative Path: assets/svg/linux_scatter_field.svg
    - Artifact Type: other
    - Version: 1.0.0
    - Date: 2026-07-19
    - Update: Sunday, July 19, 2026
    - Author: Dennis 'dendogg' Smaltz
    - A.I. Acknowledgement: Anthropic - Claude Fable 5
    - Signature: ︻デ═─── ✦ ✦ ✦ | Aim Twice, Shoot Once!

✒ Description:
    A 1920x1080 dark wallpaper/backdrop of faint, scattered Linux and terminal
    ephemera - line-art icons (tux, folders, gears, servers, chip, globe, lock,
    database) interleaved with monospace shell fragments (apt, ls -la, grep,
    uname, systemctl, a filesystem tree). Watermark-subtle by design; sits
    behind UI or content without competing with it.

✒ Key Features:
    - 70+ hand-placed elements across a 1920x1080 field with jittered rotation for a natural scatter
    - ~20 reusable line-art symbols defined once in defs and stamped via use references
    - Authentic shell fragments: apt, ls -la, grep, uname -a, systemctl, chmod, and a /-rooted fs tree
    - Three opacity tiers (0.05 / 0.075 / 0.10) so the field has quiet depth instead of a flat wash
    - Single global dimmer: the opacity attribute on g#watermark scales the whole field at once
    - Stroke-only iconography on a soft radial charcoal gradient - no fills fighting the background
    - System monospace font stack; no webfonts, no rasters, no external references
    - Companion piece to termux_constellation - same palette family, opposite energy

✒ Usage Instructions:
    Use as a desktop wallpaper, app backdrop, hero underlay, or slide
    background. To dim or brighten the entire field, edit the opacity
    attribute on <g id="watermark"> (default 1; try 0.5 for barely-there,
    matching the reference mock). To retint, change the two stroke/fill
    colors: #6b5d4f (elements) and the background gradient stops.

✒ Examples:
    - Wallpaper export:        cairosvg linux_scatter_field.svg -o wall.png -W 3840
    - CSS backdrop:            body { background: #12161b url('linux_scatter_field.svg') center/cover; }
    - Hero underlay:           place content in a sibling layer above the SVG
    - Dimmer to 50%:           <g id="watermark" opacity="0.5">
    - Inkscape remix:          every icon is a defs symbol - restamp freely with clones
    - OBS / stream scene:      drop in as a bottom image source

✒ Other Important Information:
    - Dependencies: none (self-contained SVG 1.1)
    - Compatible platforms: all modern browsers, Inkscape, librsvg/cairosvg,
      Android WebView, VS Code preview, GNOME/KDE wallpaper via PNG export
    - Limitations: monospace metrics vary slightly per system font; the
      scatter is composed for 16:9 - heavy crops to other ratios may cut
      text fragments mid-line
- - - - - - - - -
-->
<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-labelledby="lsf-title">
  <title id="lsf-title">Linux Scatter Field (light) - faint terminal and Linux iconography on dark charcoal</title>

  <defs>
