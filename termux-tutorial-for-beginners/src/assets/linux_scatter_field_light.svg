      <path d="M 2 13 L -4 23.4 L -16 23.4 L -22 13 L -16 2.6 L -4 2.6 Z"/>
      <path d="M 22 13 L 16 23.4 L 4 23.4 L -2 13 L 4 2.6 L 16 2.6 Z"/>
    </g>

    <g id="i-dots">
