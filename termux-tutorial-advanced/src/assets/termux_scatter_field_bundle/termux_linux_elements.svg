      </g>
    </g>
  </g>
  <text x="951" y="140" text-anchor="middle" font-size="11" letter-spacing="3" fill="#5c7188">CLOUD SYNC</text>

  <!-- gear - NW (283,158) -->
  <g id="chip-gear" transform="translate(283,158)">
