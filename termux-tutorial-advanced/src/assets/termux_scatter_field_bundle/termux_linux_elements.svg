<?xml version="1.0" encoding="UTF-8"?>
<!--
✒ Metadata
    - Title: Termux Constellation (digiSpace Edition - v1.0)
    - File Name: termux_linux_elements.svg
    - Relative Path: assets/svg/termux_linux_elements.svg
    - Artifact Type: other
    - Version: 1.0.0
    - Date: 2026-07-19
    - Update: Sunday, July 19, 2026
    - Author: Dennis 'dendogg' Smaltz
    - A.I. Acknowledgement: Anthropic - Claude Fable 5
    - Signature: ︻デ═─── ✦ ✦ ✦ | Aim Twice, Shoot Once!

✒ Description:
    A dark-theme SVG composition of the portable Linux stack: a Termux-style
    terminal at center, orbited by eight chip-node icons (database, cloud,
    penguin, gear, droid, git branch, code, package) wired together with
    circuit-style connectors. Use it as a hero graphic, README banner, or
    decorative panel for Termux/Android/Linux themed projects.

✒ Key Features:
    - Central Termux-style terminal window with realistic session lines and a blinking cursor
    - Eight satellite chip nodes on an elliptical orbit, each with a hand-drawn stroke icon
    - Circuit-style dashed connectors with glow-dot terminals linking every node to the shell
    - Android-green / cyan / amber accent palette on a deep charcoal dot-grid field
    - All geometry hand-placed on a 1280x832 viewBox with verified non-overlapping layout
    - Pure vector, zero raster assets, zero external dependencies - fully self-contained
    - System-font stacks (monospace + sans) so it renders cleanly without webfonts
    - Editable structure: palette in defs, each icon in its own labeled group

✒ Usage Instructions:
    Drop the file anywhere an <img>, CSS background, or inline <svg> is
    accepted. Scales losslessly to any size; the 1280x832 viewBox keeps a
    ~1.54:1 banner ratio. To recolor, edit the gradient stops and the
    accent values (#3ddc84 green, #22d3ee cyan, #fbbf24 amber) in defs.

✒ Examples:
    - GitHub README hero:        ![stack](assets/svg/termux_linux_elements.svg)
    - HTML inline:               <img src="termux_linux_elements.svg" width="960">
    - CSS backdrop:              background: url('termux_linux_elements.svg') center/cover;
    - Inkscape remix:            open directly - every icon is a named <g>
    - PNG export:                cairosvg termux_linux_elements.svg -o banner.png -W 2560
    - Dark-mode docs panel:      embed as-is; the background is baked in

✒ Other Important Information:
    - Dependencies: none (self-contained SVG 1.1 + SMIL cursor blink)
    - Compatible platforms: all modern browsers, Inkscape, librsvg/cairosvg,
      Android WebView, VS Code preview; SMIL blink degrades gracefully to a
      static cursor where unsupported
    - Limitations: text uses system font stacks, so exact glyph metrics vary
      slightly between renderers
- - - - - - - - -
-->
<svg viewBox="0 0 1280 832" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, 'Segoe UI', sans-serif" role="img" aria-labelledby="tle-title tle-desc">
  <title id="tle-title">Termux Constellation - Linux, Termux, Android</title>
  <desc id="tle-desc">A Termux terminal window surrounded by eight Linux-themed chip icons: database, cloud, penguin, gear, droid, git branch, code, and package.</desc>

  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="46%" r="70%">
      <stop offset="0%" stop-color="#101a26"/>
      <stop offset="60%" stop-color="#0b111a"/>
      <stop offset="100%" stop-color="#070b11"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#131c29"/>
      <stop offset="100%" stop-color="#0e1520"/>
    </linearGradient>
    <linearGradient id="titlebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2836"/>
      <stop offset="100%" stop-color="#16202d"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#1b2634"/>
    </pattern>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ======================= field ======================= -->
  <rect width="1280" height="832" fill="url(#bgGlow)"/>
  <rect width="1280" height="832" fill="url(#dots)"/>
  <g fill="none" stroke="#16202d" stroke-width="1.4">
    <ellipse cx="640" cy="416" rx="440" ry="300"/>
    <ellipse cx="640" cy="416" rx="520" ry="356" stroke-dasharray="1 10" stroke-linecap="round"/>
  </g>

  <!-- ==================== connectors ===================== -->
  <g stroke="#2a3b4d" stroke-width="1.6" stroke-dasharray="2 7" stroke-linecap="round" fill="none">
    <path d="M 640 246 V 176"/>                      <!-- to penguin (top) -->
    <path d="M 640 586 V 656"/>                      <!-- to code (bottom) -->
    <path d="M 400 416 H 260"/>                      <!-- to droid (left) -->
    <path d="M 880 416 H 1020"/>                     <!-- to database (right) -->
    <path d="M 872 254 L 918 214"/>                  <!-- to cloud (NE) -->
    <path d="M 408 254 L 362 214"/>                  <!-- to gear (NW) -->
    <path d="M 408 578 L 362 618"/>                  <!-- to git (SW) -->
    <path d="M 872 578 L 918 618"/>                  <!-- to package (SE) -->
  </g>
  <g fill="#3ddc84" filter="url(#softGlow)">
    <circle cx="640" cy="176" r="3"/>
    <circle cx="640" cy="656" r="3"/>
    <circle cx="260" cy="416" r="3"/>
    <circle cx="1020" cy="416" r="3"/>
    <circle cx="918" cy="214" r="3"/>
    <circle cx="362" cy="214" r="3"/>
    <circle cx="362" cy="618" r="3"/>
    <circle cx="918" cy="618" r="3"/>
  </g>

  <!-- ===================== terminal ====================== -->
  <g id="terminal">
    <rect x="400" y="246" width="480" height="340" rx="14" fill="url(#panel)" stroke="#243447" stroke-width="1.6"/>
    <path d="M 400 260 a14 14 0 0 1 14-14 h452 a14 14 0 0 1 14 14 v22 h-480 z" fill="url(#titlebar)"/>
    <line x1="400" y1="282" x2="880" y2="282" stroke="#243447" stroke-width="1.2"/>
    <circle cx="424" cy="264" r="5" fill="#ff5f56"/>
    <circle cx="442" cy="264" r="5" fill="#ffbd2e"/>
    <circle cx="460" cy="264" r="5" fill="#27c93f"/>
    <text x="640" y="269" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', 'JetBrains Mono', monospace" font-size="12" fill="#8aa0b6">termux@localhost: ~</text>

    <g font-family="ui-monospace, 'Cascadia Code', 'JetBrains Mono', monospace" font-size="14">
      <text x="424" y="314"><tspan fill="#3ddc84">~ $</tspan><tspan fill="#dbe7f3" dx="8">pkg update &amp;&amp; pkg upgrade -y</tspan></text>
      <text x="424" y="340" fill="#8aa0b6">Get:1 stable/main aarch64 Packages [147 kB]</text>
      <text x="424" y="366" fill="#8aa0b6">All packages are up to date.</text>
      <text x="424" y="392"><tspan fill="#3ddc84">~ $</tspan><tspan fill="#dbe7f3" dx="8">pip install rich</tspan></text>
      <text x="424" y="418" fill="#8aa0b6">Successfully installed rich-14.0.0</text>
      <text x="424" y="444"><tspan fill="#3ddc84">~ $</tspan><tspan fill="#dbe7f3" dx="8">ssh dendogg@digispace</tspan></text>
      <text x="424" y="470"><tspan fill="#22d3ee">[forge]</tspan><tspan fill="#8aa0b6" dx="8">connection established</tspan></text>
      <text x="424" y="500"><tspan fill="#3ddc84">~ $</tspan></text>
      <rect x="462" y="488" width="9" height="15" fill="#3ddc84">
        <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- android status strip -->
    <g stroke="#2a3b4d" stroke-width="1.2">
      <line x1="424" y1="552" x2="856" y2="552"/>
    </g>
    <g font-family="ui-monospace, monospace" font-size="11" fill="#5c7188">
      <text x="424" y="572">aarch64</text>
      <text x="640" y="572" text-anchor="middle">no-root shell</text>
      <text x="856" y="572" text-anchor="end">bash 5.2</text>
    </g>
  </g>

  <!-- =================== chip template =================== -->
  <!-- each chip: 92x92 rounded node, icon strokes, label -->

  <!-- penguin - top (594,70) -->
  <g id="chip-penguin" transform="translate(594,70)">
    <rect width="92" height="92" rx="18" fill="url(#panel)" stroke="#243447" stroke-width="1.6"/>
    <g transform="translate(46,48)">
      <path d="M 0 -24 C 12 -24 15 -9 15 4 C 15 16 8 23 0 23 C -8 23 -15 16 -15 4 C -15 -9 -12 -24 0 -24 Z" fill="#1c2836" stroke="#9fb3c8" stroke-width="2"/>
      <path d="M 0 -8 C 8 -8 10 0 10 8 C 10 16 5 20 0 20 C -5 20 -10 16 -10 8 C -10 0 -8 -8 0 -8 Z" fill="#dbe7f3"/>
      <circle cx="-5" cy="-14" r="2" fill="#dbe7f3"/>
      <circle cx="5" cy="-14" r="2" fill="#dbe7f3"/>
      <path d="M -4 -9 L 4 -9 L 0 -4 Z" fill="#fbbf24"/>
      <path d="M -9 23 h 7 l -3.5 4 z M 2 23 h 7 l -3.5 4 z" fill="#fbbf24"/>
    </g>
  </g>
  <text x="640" y="56" text-anchor="middle" font-size="11" letter-spacing="3" fill="#5c7188">LINUX</text>

  <!-- code - bottom (594,670) -->
  <g id="chip-code" transform="translate(594,670)">
    <rect width="92" height="92" rx="18" fill="url(#panel)" stroke="#243447" stroke-width="1.6"/>
    <g stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 34 34 L 22 46 L 34 58"/>
      <path d="M 58 34 L 70 46 L 58 58"/>
      <path d="M 51 30 L 41 62" stroke="#9fb3c8"/>
    </g>
  </g>
  <text x="640" y="786" text-anchor="middle" font-size="11" letter-spacing="3" fill="#5c7188">SHELL SCRIPT</text>

  <!-- droid - left (154,370) -->
  <g id="chip-droid" transform="translate(154,370)">
    <rect width="92" height="92" rx="18" fill="url(#panel)" stroke="#243447" stroke-width="1.6"/>
    <g transform="translate(46,48)">
      <path d="M -15 -4 A 15 15 0 0 1 15 -4 Z" fill="#3ddc84"/>
      <g stroke="#3ddc84" stroke-width="2.4" stroke-linecap="round">
        <line x1="-10" y1="-15" x2="-15" y2="-23"/>
        <line x1="10" y1="-15" x2="15" y2="-23"/>
      </g>
      <circle cx="-6" cy="-9" r="1.9" fill="#0b111a"/>
      <circle cx="6" cy="-9" r="1.9" fill="#0b111a"/>
      <rect x="-15" y="0" width="30" height="20" rx="5" fill="none" stroke="#3ddc84" stroke-width="2.4"/>
      <line x1="-8" y1="6" x2="-8" y2="14" stroke="#3ddc84" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="8" y1="6" x2="8" y2="14" stroke="#3ddc84" stroke-width="2.4" stroke-linecap="round"/>
    </g>
  </g>
  <text x="200" y="486" text-anchor="middle" font-size="11" letter-spacing="3" fill="#5c7188">ANDROID</text>

  <!-- database - right (1034,370) -->
  <g id="chip-database" transform="translate(1034,370)">
    <rect width="92" height="92" rx="18" fill="url(#panel)" stroke="#243447" stroke-width="1.6"/>
    <g transform="translate(46,46)" stroke="#fbbf24" stroke-width="2.4" fill="none" stroke-linecap="round">
      <ellipse cx="0" cy="-15" rx="16" ry="6"/>
      <path d="M -16 -15 V 15 A 16 6 0 0 0 16 15 V -15"/>
      <path d="M -16 0 A 16 6 0 0 0 16 0"/>
    </g>
  </g>
  <text x="1080" y="486" text-anchor="middle" font-size="11" letter-spacing="3" fill="#5c7188">SQLITE</text>

  <!-- cloud - NE (905,158) -->
  <g id="chip-cloud" transform="translate(905,158)">
    <rect width="92" height="92" rx="18" fill="url(#panel)" stroke="#243447" stroke-width="1.6"/>
    <g transform="translate(46,50)">
      <g fill="#22d3ee">
        <circle cx="-9" cy="2" r="10"/>
        <circle cx="3" cy="-5" r="12"/>
        <circle cx="13" cy="4" r="8"/>
        <rect x="-17" y="2" width="38" height="10" rx="5"/>
      </g>
      <g stroke="#0b111a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
