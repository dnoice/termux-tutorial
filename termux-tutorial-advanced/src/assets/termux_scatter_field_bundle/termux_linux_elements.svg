      <path d="M 0 -3 V 17"/>
      <path d="M -8 -15 L 8 -7" stroke="#9fb3c8"/>
    </g>
  </g>
  <text x="951" y="698" text-anchor="middle" font-size="11" letter-spacing="3" fill="#5c7188">PKG</text>

  <!-- ====================== caption ====================== -->
  <text x="640" y="818" text-anchor="middle" font-size="12" letter-spacing="6" fill="#3f5266">LINUX &#183; TERMUX &#183; ANDROID</text>
  <text x="1252" y="818" text-anchor="end" font-size="11" fill="#2e3d4e" font-family="ui-monospace, monospace">&#65083;&#12487;&#9552;&#9472;&#9472;&#9472; &#10022; &#10022; &#10022;</text>
</svg>
