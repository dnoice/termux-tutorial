        <line x1="0" y1="15" x2="0" y2="21"/>
        <line x1="-15" y1="0" x2="-21" y2="0"/>
        <line x1="15" y1="0" x2="21" y2="0"/>
        <line x1="-10.6" y1="-10.6" x2="-14.8" y2="-14.8"/>
        <line x1="10.6" y1="-10.6" x2="14.8" y2="-14.8"/>
        <line x1="-10.6" y1="10.6" x2="-14.8" y2="14.8"/>
        <line x1="10.6" y1="10.6" x2="14.8" y2="14.8"/>
      </g>
      <circle r="14" fill="none" stroke="#9fb3c8" stroke-width="2.6"/>
      <circle r="5.5" fill="none" stroke="#9fb3c8" stroke-width="2.6"/>
    </g>
  </g>
  <text x="329" y="140" text-anchor="middle" font-size="11" letter-spacing="3" fill="#5c7188">DOTFILES</text>

  <!-- git branch - SW (283,582) -->
  <g id="chip-git" transform="translate(283,582)">
    <rect width="92" height="92" rx="18" fill="url(#panel)" stroke="#243447" stroke-width="1.6"/>
    <g transform="translate(46,46)" stroke="#f97316" stroke-width="2.4" fill="none" stroke-linecap="round">
      <circle cx="-9" cy="-13" r="5"/>
      <circle cx="-9" cy="13" r="5"/>
      <circle cx="12" cy="-1" r="5"/>
