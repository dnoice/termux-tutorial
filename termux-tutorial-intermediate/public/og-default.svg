<?xml version="1.0" encoding="UTF-8"?>
<!--
  SOURCE for public/og-default.png (the social share card).

  Crawlers (X, Discord, Slack, LinkedIn, iMessage) will not render SVG for
  og:image, so this file is the editable original and the PNG beside it is what
  ships in the meta tag. Re-render after editing:

    node -e "const s=require('sharp');s('public/og-default.svg',{density:150}).resize(1200,630).png({compressionLevel:9}).toFile('public/og-default.png')"

  Literal colours are unavoidable in a raster asset — a PNG cannot read a CSS
  custom property. They mirror the design tokens exactly (token names written
  without their leading dashes; XML comments forbid a double hyphen):
    #0e1014 = tmx-screen / dark bg-canvas
    #d4b15c = color-brand (brass, the single accent)
    #8e8676 = tmx-screen-muted (the AA-safe muted ink for obsidian surfaces)
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
	<rect width="1200" height="630" fill="#0e1014"/>

	<!-- Scatter Field echo: sparse brass ticks, the same motif as the site background. -->
	<g fill="#d4b15c" opacity="0.10">
		<rect x="96" y="150" width="10" height="2"/>
		<rect x="140" y="470" width="10" height="2"/>
		<rect x="1060" y="212" width="10" height="2"/>
		<rect x="1010" y="520" width="10" height="2"/>
		<rect x="980" y="96" width="2" height="10"/>
		<rect x="132" y="560" width="2" height="10"/>
		<rect x="1104" y="404" width="2" height="10"/>
	</g>

	<!-- Dossier rule: a hairline frame, brass, low opacity. -->
	<rect x="40" y="40" width="1120" height="550" fill="none" stroke="#d4b15c" stroke-opacity="0.28" stroke-width="2"/>

	<!-- Prompt kicker — the fish prompt the whole course is taught in. -->
	<text x="96" y="196" font-family="Consolas, 'JetBrains Mono', monospace" font-size="30" letter-spacing="2" fill="#d4b15c">~ &#x276F; termux-battery-status</text>

	<!-- Wordmark. -->
	<!-- 78px, not 96: at 96 the wordmark measured ~1100px wide and collided with
	     the 1160px frame edge. 78 lands it at ~890px, inside the safe area that
	     Discord and iMessage crop to. -->
	<text x="96" y="316" font-family="Georgia, 'Crimson Pro', 'Times New Roman', serif" font-size="78" font-weight="700" fill="#d4b15c">Termux: Intermediate</text>

	<!-- Tagline: the site tagline, verbatim. -->
	<text x="96" y="392" font-family="Georgia, 'Source Serif 4', 'Times New Roman', serif" font-size="40" fill="#8e8676">Your phone, talking to its own hardware.</text>

	<!-- Brass underscore, cursor-shaped. -->
	<rect x="96" y="452" width="220" height="6" fill="#d4b15c"/>

	<text x="96" y="546" font-family="Consolas, 'JetBrains Mono', monospace" font-size="26" fill="#8e8676">Termux:API &#183; scripting &#183; scheduling &#183; serving</text>
</svg>
