# Build every course in this monorepo and deploy them as ONE GitHub Pages site.
#
# GitHub Pages publishes exactly one artifact per repository, so the three
# courses cannot each deploy themselves — they are built separately and
# assembled into a single tree here:
#
#   _site/                   <- the hub    (base /termux-tutorial)
#   _site/beginner/          <- course 1   (base /termux-tutorial/beginner)
#   _site/intermediate/      <- course 2   (base /termux-tutorial/intermediate)
#   _site/advanced/          <- course 3
#
# The HUB is the site root: it is the front door, and the only page that can
# see all three courses at once. Each course keeps its own package.json, its
# own guards and its own base — they are independent projects that ship
# together.
#
# NOTE: Pages from a PRIVATE repository requires GitHub Pro or higher. On the
# free plan this workflow will build and then fail at the deploy step until the
# repo is public.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Validate PRs too: build + typecheck run, deploy does not (see the job `if`).
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # NOT cancel-in-progress. GitHub explicitly warns against cancelling a live
  # Pages deployment: the run that is interrupted may have already begun
  # swapping the site, leaving it half-published.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Astro 7 requires ^20.19 || ^22.12 || >=24. Pinned, so a runner image
          # bump cannot break the build with no change to this repo.
          node-version: 22
          cache: npm
          cache-dependency-path: |
            hub/package-lock.json
            termux-tutorial-for-beginners/package-lock.json
            termux-tutorial-intermediate/package-lock.json
            termux-tutorial-advanced/package-lock.json

      # Cheap, dependency-free, and guards a failure that is otherwise silent:
      # the single-port dev proxy routes HMR sockets by each project's
      # `server.hmr.path`, so a project whose astro.config disagrees with
      # scripts/projects.mjs simply stops hot-reloading, with nothing in any
      # terminal. It costs nothing to check here and an afternoon to find by hand.
      - name: Check HMR routing consistency
        run: node scripts/check-hmr.mjs

      # --------------------------------------------------------------------- hub
      - name: Install — hub
        working-directory: hub
        run: npm ci

      - name: Typecheck — hub
        working-directory: hub
        run: npm run check

      - name: Build — hub
        working-directory: hub
        # Reads each course's LESSONS array from disk for its dashboard totals,
        # and FAILS if a course is present but unparseable — so the hub can
        # never quietly ship claiming a finished course does not exist.
        run: npm run build

      # ---------------------------------------------------------------- beginner
      - name: Install — beginner
        working-directory: termux-tutorial-for-beginners
        run: npm ci

      - name: Typecheck — beginner
        # `astro build` does not typecheck, so strict mode is decorative without
        # this step. This is what makes it real.
        working-directory: termux-tutorial-for-beginners
        run: npm run check

      - name: Build — beginner
        working-directory: termux-tutorial-for-beginners
        # Runs the curriculum guard, astro build, and the link checker.
        run: npm run build

      # ------------------------------------------------------------ intermediate
      - name: Install — intermediate
        working-directory: termux-tutorial-intermediate
        run: npm ci

      - name: Typecheck — intermediate
        working-directory: termux-tutorial-intermediate
        run: npm run check

      - name: Build — intermediate
        working-directory: termux-tutorial-intermediate
        run: npm run build

      # -------------------------------------------------------------- advanced
      - name: Install — advanced
        working-directory: termux-tutorial-advanced
        run: npm ci

      - name: Typecheck — advanced
        working-directory: termux-tutorial-advanced
        run: npm run check

      - name: Build — advanced
        working-directory: termux-tutorial-advanced
        run: npm run build

      # ---------------------------------------------------------------- assemble
      #
      # Both steps run the SAME scripts a developer runs locally, and both read
      # the four-project layout from scripts/projects.mjs. This used to be the
      # layout written out a third time in inline shell, which meant CI could
      # assemble the site differently from every local machine and nothing would
      # say so. It also meant assembly existed only here — so the one
      # arrangement in which cross-course links resolve was the one nobody could
      # reproduce before pushing.
      - name: Assemble the site
        run: node scripts/assemble.mjs

      # Cross-course links resolve ONLY in the assembled tree — no course's own
      # check-links.mjs can see a sibling, so each one defers them to this.
      #
      # The previous check read _site/index.html and nothing else: one page out
      # of forty-five, and the one least likely to be wrong, since the hub
      # generates its links from a manifest. Every hand-authored cross-course
      # link in every lesson went unchecked.
      - name: Verify cross-course links
        run: node scripts/check-assembled-links.mjs _site

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    # A pull request gets the build and the typecheck, never the deployment.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
