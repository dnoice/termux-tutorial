# Build every course in this monorepo and deploy them as ONE GitHub Pages site.
#
# GitHub Pages publishes exactly one artifact per repository, so the three
# courses cannot each deploy themselves — they are built separately and
# assembled into a single tree here:
#
#   _site/                   <- the hub    (base /termux-tutorial)
#   _site/beginner/          <- course 1   (base /termux-tutorial/beginner)
#   _site/intermediate/      <- course 2   (base /termux-tutorial/intermediate)
#   _site/advanced/          <- course 3
#
# The HUB is the site root: it is the front door, and the only page that can
# see all three courses at once. Each course keeps its own package.json, its
# own guards and its own base — they are independent projects that ship
# together.
#
# NOTE: Pages from a PRIVATE repository requires GitHub Pro or higher. On the
# free plan this workflow will build and then fail at the deploy step until the
# repo is public.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Validate PRs too: build + typecheck run, deploy does not (see the job `if`).
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # NOT cancel-in-progress. GitHub explicitly warns against cancelling a live
  # Pages deployment: the run that is interrupted may have already begun
  # swapping the site, leaving it half-published.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Astro 7 requires ^20.19 || ^22.12 || >=24. Pinned, so a runner image
          # bump cannot break the build with no change to this repo.
          node-version: 22
          cache: npm
          cache-dependency-path: |
            hub/package-lock.json
            termux-tutorial-for-beginners/package-lock.json
            termux-tutorial-intermediate/package-lock.json
            termux-tutorial-advanced/package-lock.json

      # --------------------------------------------------------------------- hub
      - name: Install — hub
        working-directory: hub
        run: npm ci

      - name: Typecheck — hub
        working-directory: hub
        run: npm run check

      - name: Build — hub
        working-directory: hub
        # Reads each course's LESSONS array from disk for its dashboard totals,
        # and FAILS if a course is present but unparseable — so the hub can
        # never quietly ship claiming a finished course does not exist.
        run: npm run build

      # ---------------------------------------------------------------- beginner
      - name: Install — beginner
        working-directory: termux-tutorial-for-beginners
        run: npm ci

      - name: Typecheck — beginner
        # `astro build` does not typecheck, so strict mode is decorative without
        # this step. This is what makes it real.
        working-directory: termux-tutorial-for-beginners
        run: npm run check

      - name: Build — beginner
        working-directory: termux-tutorial-for-beginners
        # Runs the curriculum guard, astro build, and the link checker.
        run: npm run build

      # ------------------------------------------------------------ intermediate
      - name: Install — intermediate
        working-directory: termux-tutorial-intermediate
        run: npm ci

      - name: Typecheck — intermediate
        working-directory: termux-tutorial-intermediate
        run: npm run check

      - name: Build — intermediate
        working-directory: termux-tutorial-intermediate
        run: npm run build

      # -------------------------------------------------------------- advanced
      - name: Install — advanced
        working-directory: termux-tutorial-advanced
        run: npm ci

      - name: Typecheck — advanced
        working-directory: termux-tutorial-advanced
        run: npm run check

      - name: Build — advanced
        working-directory: termux-tutorial-advanced
        run: npm run build

      # ---------------------------------------------------------------- assemble
      - name: Assemble the site
        run: |
          set -euo pipefail
          rm -rf _site
          # The hub is the root of the published site.
          cp -r hub/dist _site
          # Each course nests under it, at the path its own `base` expects.
          for course in beginner:termux-tutorial-for-beginners                         intermediate:termux-tutorial-intermediate                         advanced:termux-tutorial-advanced; do
            seg="${course%%:*}"; dir="${course##*:}"
            mkdir -p "_site/$seg"
            cp -r "$dir/dist/." "_site/$seg/"
            echo "  $seg: $(find "_site/$seg" -name '*.html' | wc -l) pages"
          done
          echo "Assembled $(find _site -name '*.html' | wc -l) HTML pages total."

          # Fail loudly rather than deploying half a site. Each of these is a
          # page a visitor can reach from the hub's own markup, so a missing one
          # is a broken link on the front door.
          for must in index.html beginner/index.html intermediate/index.html advanced/index.html; do
            test -f "_site/$must" || { echo "MISSING: _site/$must"; exit 1; }
          done

          # Cross-course links resolve ONLY in the assembled tree — no course's
          # own check-links.mjs can see a sibling, so they defer them here.
          #
          # This used to be an inline script that read _site/index.html and
          # nothing else: one page out of forty-five, and the one least likely
          # to be wrong, since the hub generates its links from a manifest.
          # Every hand-authored cross-course link in every lesson went
          # unchecked. The script walks the whole tree, and it lives in the repo
          # so it can be run locally against a local assembly rather than only
          # discovered to be failing here, after a push.
          node scripts/check-assembled-links.mjs _site

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    # A pull request gets the build and the typecheck, never the deployment.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
